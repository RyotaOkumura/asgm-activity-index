[project]
name = "asgm-activity-index"
version = "0.1.0"
description = "Activity Index and Pan-ASGM benchmark: tracking artisanal gold mining activity with Sentinel-2 time series"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
requires-python = ">=3.10,<3.11"
# Versions are pinned to the environment that produced the paper numbers.
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "segmentation-models-pytorch==0.5.0",
    "transformers==4.57.6",
    "terratorch==1.2.1",
    "timm==1.0.24",
    "huggingface-hub==0.36.2",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.2",
    "opencv-python-headless==4.13.0.90",
    "tifffile==2025.5.10",
    "ruptures==1.1.10",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activity_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: needs pretrained weights from the Hugging Face Hub",
    "repo: needs the original research repository (maintainers only)",
]
